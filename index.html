<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Heartscapes – AR Viewer</title>
  <!-- A‑Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {margin:0; height:100%; overflow:hidden; background:#000; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;}
    #scene { position:fixed; inset:0; z-index:0; }
    a-scene, canvas, .a-canvas { background: transparent !important; }

    .hud {position:fixed; left:0; right:0; display:flex; justify-content:center; gap:12px; z-index:10;}
    #splash {inset:0; position:fixed; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; z-index:20;}
    #splash h1 {margin:0 0 8px 0; font-size:20px;}
    #splash p {opacity:.85; max-width:520px; line-height:1.5;}
    #start {margin-top:16px; padding:12px 18px; border-radius:12px; border:1px solid #444; background:#111; color:#fff; cursor: pointer;}
    #start:active {transform: scale(0.98);}
    #ctaBar {bottom:20px;}
    .btn {padding:12px 14px; border-radius:12px; border:1px solid #333; background:#111; color:#fff; min-width:140px; cursor: pointer;}
    .btn:active {transform:scale(0.98)}
    #label {position:fixed; top:14px; left:14px; right:14px; color:#fff; text-align:center; opacity:.95; z-index:10}
    #label span {background:rgba(0,0,0,.55); padding:6px 10px; border-radius:10px;}

    #grid {position:fixed; inset:0; pointer-events:none; background:
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 0 33.33%/100% 1px no-repeat,
      linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 0 66.66%/100% 1px no-repeat,
      linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.12)) 33.33% 0/1px 100% no-repeat,
      linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.12)) 66.66% 0/1px 100% no-repeat;
      opacity:.35; display:none; z-index:5; }

    #vfBar { position:fixed; right:12px; bottom:12px; display:flex; gap:8px; z-index:10; }
    .chip { padding:8px 10px; border-radius:999px; border:1px solid #333; background:#111; color:#fff; font-size:12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="splash">
    <h1>Heartscapes – AR</h1>
    <p>Point your camera at one of the artworks in the Heartscapes exhibit. When a work is recognized, tap the button to learn more about it.</p>
    <button id="start">Start Camera</button>
  </div>

  <div id="label"><span id="labelText">Align an artwork within view…</span></div>

  <div class="hud" id="ctaBar" style="display:none;">
    <button class="btn" id="openInfo">Learn More</button>
  </div>

  <div id="vfBar">
    <button class="chip" id="toggleGrid">Grid</button>
  </div>
  <div id="grid"></div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./assets/targets/targets.mind; maxTrack: 1; uiScanning: true;"
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true; antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
    style="display:none;"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- PATHOLOGY (Aortic stenosis) indices 0..2 -->
    <a-entity mindar-image-target="targetIndex: 0"
      id="path-severe"
      data-name="Severe Aortic Stenosis"

    <a-entity mindar-image-target="targetIndex: 2"
      id="path-healthy"
      data-name="Healthy Aortic Valve"
      data-url="https://unisydneyedu.sharepoint.com/:u:/r/sites/HeartscapesTheStructureofLife/SitePages/Valve-Pathology---Aortic-Stenosis.aspx?csf=1&web=1&share=EflVcCYjISZAhtiuCE7V8k4Bp3rD2yGRa2vbKf3Av_9t8Q&e=ZMU9WQ"></a-entity>

    <a-entity mindar-image-target="targetIndex: 3"

      data-url="https://unisydneyedu.sharepoint.com/:u:/r/sites/HeartscapesTheStructureofLife/SitePages/Geo-historical.aspx?csf=1&web=1&share=EaZwatfZEN5Lu7CfCKk721MBfjcVJbUcMSLe7-LoiTcWBQ&e=jKh0Xg"></a-entity>

      data-url="https://unisydneyedu.sharepoint.com/:u:/r/sites/HeartscapesTheStructureofLife/SitePages/Geo-historical.aspx?csf=1&web=1&share=EaZwatfZEN5Lu7CfCKk721MBfjcVJbUcMSLe7-LoiTcWBQ&e=jKh0Xg"></a-entity>

    <a-entity mindar-image-target="targetIndex: 6"

    <!-- WATERCOLOUR / HISTOLOGY indices 17..18 -->

      id="histology-2"

    <a-entity mindar-image-target="targetIndex: 18"
      id="histology-1"

      data-url="https://unisydneyedu.sharepoint.com/:u:/r/sites/HeartscapesTheStructureofLife/SitePages/Watercolour.aspx?csf=1&web=1&share=EVALhfSyTQJNnNoGlub4dIwB07DS13P4TOtzG12ziGRc2Q&e=usYMb1"></a-entity>

  </a-scene>

  <script>
    const labelText = document.getElementById('labelText');
    const ctaBar = document.getElementById('ctaBar');
    const openInfo = document.getElementById('openInfo');

    let currentTarget = null;

    function bindTarget(el){
      el.addEventListener('targetFound', () => {
        currentTarget = el;
        const name = el.dataset.name || el.id;
        labelText.textContent = name;
        ctaBar.style.display = 'flex';
      });
      el.addEventListener('targetLost', () => {
        if (currentTarget === el) {
          currentTarget = null;
          labelText.textContent = 'Align an artwork within view…';
          ctaBar.style.display = 'none';
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[mindar-image-target]').forEach(bindTarget);

      // Learn More button opens the URL
      if (openInfo) openInfo.addEventListener('click', () => {
        if (!currentTarget) return;
        const url = currentTarget.dataset.url;
        if (url) window.open(url, '_blank');
      });

      // Splash: start camera
      const startBtn = document.getElementById('start');
      const splash = document.getElementById('splash');
      const scene = document.getElementById('scene');
      if (startBtn) startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (splash) splash.style.display='none';
        if (scene) scene.style.display='block';
      });

      // Make canvas transparent
      scene.addEventListener('loaded', () => {
        const r = scene.renderer;
        if (r && r.setClearColor) r.setClearColor(0x000000, 0);
      });

      // Grid toggle
      const grid = document.getElementById('grid');
      document.getElementById('toggleGrid').addEventListener('click', () => {
        grid.style.display = (grid.style.display === 'none' || !grid.style.display) ? 'block' : 'none';
      });
    });
  </script>
</body>
</html>
