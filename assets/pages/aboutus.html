<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      font-family: 'DM Sans', sans-serif;
    }

    .team-hero {
      position: relative;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 45px -18px rgba(15, 23, 42, 0.35);
      min-height: 220px;
      background-image: linear-gradient(to right, rgba(79, 70, 229, 0.45), rgba(15, 23, 42, 0.4)),
        url('/assets/images/groupphoto.jpeg');
      background-size: cover;
      background-position: center;
    }

    .member-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .member-card:hover {
      transform: translateY(-6px) scale(1.01);
    }

    .photo-frame {
      transition: box-shadow 0.3s ease;
      box-shadow: 0 12px 26px -12px rgba(0, 0, 0, 0.45);
    }

    .member-card:hover .photo-frame {
      box-shadow: 0 20px 36px -14px rgba(0, 0, 0, 0.5);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app-container" class="w-full h-full overflow-auto p-6 md:p-10">
   <div class="max-w-5xl mx-auto space-y-8 md:space-y-10">
    <section class="team-hero flex items-end p-6 md:p-8">
     <div class="bg-black/35 text-white backdrop-blur-sm rounded-xl px-4 py-3">
      <h1 class="text-2xl md:text-3xl font-semibold">Meet The Cardiac Crew</h1>
      <p class="text-sm md:text-base opacity-90">The team behind the exhibit.</p>
     </div>
    </section>

    <div id="members-grid" class="grid grid-cols-2 md:grid-cols-3 gap-6 md:gap-8">
     <!-- Member cards will be generated here -->
    </div>
   </div>
  </div>

  <script>
    const memberImages = {
      1: '/assets/images/eliza.jpeg',
      2: '/assets/images/janice.jpeg',
      3: '/assets/images/verica.jpeg',
      4: '/assets/images/anh.jpeg',
      5: '/assets/images/aoibh.jpeg',
      6: '/assets/images/josh.jpeg'
    };

    const defaultConfig = {
      background_color: '#f8fafc',
      card_color: '#ffffff',
      text_color: '#1e293b',
      accent_color: '#6366f1',
      email_color: '#64748b',
      font_family: 'DM Sans',
      font_size: 16,
      member_1_name: 'Eliza',
      member_1_email: 'eliza@example.com',
      member_2_name: 'Janice',
      member_2_email: 'janice@example.com',
      member_3_name: 'Verica',
      member_3_email: 'verica@example.com',
      member_4_name: 'Anh',
      member_4_email: 'anh@example.com',
      member_5_name: 'Aoibh',
      member_5_email: 'aoibh@example.com',
      member_6_name: 'Josh',
      member_6_email: 'josh@example.com'
    };

    let config = { ...defaultConfig };

    function createMemberCards() {
      const grid = document.getElementById('members-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= 6; i++) {
        const card = document.createElement('div');
        card.className = 'member-card';
        card.id = `member-${i}`;
        card.innerHTML = `
          <div class="photo-frame rounded-2xl overflow-hidden bg-white">
            <img src="${memberImages[i]}" alt="Team member ${i}" class="w-full aspect-square object-cover" loading="lazy">
          </div>
          <div class="mt-4 text-center">
            <h3 id="name-${i}" class="font-semibold"></h3>
            <a id="email-${i}" href="#" class="text-sm hover:underline"></a>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function onConfigChange(cfg) {
      config = cfg;

      const container = document.getElementById('app-container');
      container.style.backgroundColor = cfg.background_color || defaultConfig.background_color;

      const fontFamily = cfg.font_family || defaultConfig.font_family;
      const baseSize = cfg.font_size || defaultConfig.font_size;

      for (let i = 1; i <= 6; i++) {
        const name = cfg[`member_${i}_name`] || defaultConfig[`member_${i}_name`];
        const email = cfg[`member_${i}_email`] || defaultConfig[`member_${i}_email`];

        const nameEl = document.getElementById(`name-${i}`);
        const emailEl = document.getElementById(`email-${i}`);

        if (nameEl) {
          nameEl.textContent = name;
          nameEl.style.color = cfg.text_color || defaultConfig.text_color;
          nameEl.style.fontFamily = `${fontFamily}, sans-serif`;
          nameEl.style.fontSize = `${baseSize * 1.125}px`;
        }

        if (emailEl) {
          emailEl.textContent = email;
          emailEl.href = `mailto:${email}`;
          emailEl.style.color = cfg.email_color || defaultConfig.email_color;
          emailEl.style.fontFamily = `${fontFamily}, sans-serif`;
          emailEl.style.fontSize = `${baseSize * 0.875}px`;
        }
      }

      const cards = document.querySelectorAll('.photo-frame');
      cards.forEach(card => {
        card.style.backgroundColor = cfg.card_color || defaultConfig.card_color;
      });
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [
          {
            get: () => cfg.background_color || defaultConfig.background_color,
            set: (value) => { cfg.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => cfg.card_color || defaultConfig.card_color,
            set: (value) => { cfg.card_color = value; window.elementSdk.setConfig({ card_color: value }); }
          },
          {
            get: () => cfg.text_color || defaultConfig.text_color,
            set: (value) => { cfg.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => cfg.accent_color || defaultConfig.accent_color,
            set: (value) => { cfg.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
          },
          {
            get: () => cfg.email_color || defaultConfig.email_color,
            set: (value) => { cfg.email_color = value; window.elementSdk.setConfig({ email_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => cfg.font_family || defaultConfig.font_family,
          set: (value) => { cfg.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => cfg.font_size || defaultConfig.font_size,
          set: (value) => { cfg.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map([
        ['member_1_name', cfg.member_1_name || defaultConfig.member_1_name],
        ['member_1_email', cfg.member_1_email || defaultConfig.member_1_email],
        ['member_2_name', cfg.member_2_name || defaultConfig.member_2_name],
        ['member_2_email', cfg.member_2_email || defaultConfig.member_2_email],
        ['member_3_name', cfg.member_3_name || defaultConfig.member_3_name],
        ['member_3_email', cfg.member_3_email || defaultConfig.member_3_email],
        ['member_4_name', cfg.member_4_name || defaultConfig.member_4_name],
        ['member_4_email', cfg.member_4_email || defaultConfig.member_4_email],
        ['member_5_name', cfg.member_5_name || defaultConfig.member_5_name],
        ['member_5_email', cfg.member_5_email || defaultConfig.member_5_email],
        ['member_6_name', cfg.member_6_name || defaultConfig.member_6_name],
        ['member_6_email', cfg.member_6_email || defaultConfig.member_6_email]
      ]);
    }

    createMemberCards();

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    } else {
      onConfigChange(defaultConfig);
    }
  </script>
 </body>
</html>
